<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#980000">
<title>HFK 멤버 대쉬보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --hfk-red: #980000;
    --hfk-red-soft: #f7ecec;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --ink-3: #7a7a7a;
    --line: #e6e6e6;
    --bg: #fafafa;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Noto Sans KR", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  h1 .accent { color: var(--hfk-red); }
  .meta { color: var(--ink-3); font-size: 13px; }
  .meta .status { color: var(--ink-2); }
  .meta .status.err { color: var(--hfk-red); }
  .meta .lock-btn {
    margin-left: 8px; font-size: 12px; background: transparent; border: 0;
    color: var(--ink-3); cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  .meta .lock-btn:hover { color: var(--hfk-red); background: var(--hfk-red-soft); }

  section { margin-top: 40px; }
  h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  h2 .sub { font-size: 13px; font-weight: 400; color: var(--ink-3); margin-left: 8px; }

  /* KPI tiles */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .kpi {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }
  .kpi .label {
    font-size: 11px; color: var(--ink-3); text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .kpi .value {
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
    color: var(--ink); line-height: 1.15;
  }
  .kpi .value.red { color: var(--hfk-red); }
  .kpi .foot { margin-top: 4px; font-size: 12px; color: var(--ink-2); }

  /* Chart cards */
  .charts { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px;
  }
  .card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .card h3 .sub { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 6px; }
  .col-12 { grid-column: span 12; }
  .col-8  { grid-column: span 8; }
  .col-6  { grid-column: span 6; }
  .col-4  { grid-column: span 4; }
  @media (max-width: 900px) {
    .col-12, .col-8, .col-6, .col-4 { grid-column: span 12; }
  }
  .chart-box { position: relative; height: 280px; }
  .chart-box.tall { height: 420px; }

  /* Team/season table */
  .controls {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  select {
    font: inherit; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink); min-width: 220px;
  }
  select:focus { outline: 2px solid var(--hfk-red); outline-offset: 1px; }
  .season-summary { color: var(--ink-2); font-size: 13px; }
  .season-summary b { color: var(--ink); }

  .table-wrap {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table-wrap > table { table-layout: fixed; }
  .table-wrap > table col.c-team   { width: 220px; }
  .table-wrap > table col.c-num    { width: 90px; }
  .table-wrap > table col.c-rate   { width: 120px; }
  .table-wrap > table col.c-spacer { width: auto; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  th {
    background: #fafafa; color: var(--ink-2); font-weight: 600;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fbfbfb; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr.clickable { cursor: pointer; user-select: none; }
  tbody tr.selected { background: var(--hfk-red-soft); }
  tbody tr.selected:hover { background: var(--hfk-red-soft); }

  tr.detail-row td { padding: 0; background: #fbfafa; }
  tr.detail-row .detail-inner { padding: 12px 16px 16px; overflow-x: auto; }
  tr.detail-row table {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
    min-width: 640px;
    table-layout: fixed;
  }
  tr.detail-row col.d-idx    { width: 40px; }
  tr.detail-row col.d-name   { width: 78px; }
  tr.detail-row col.d-kind   { width: 96px; }
  tr.detail-row col.d-first  { width: 78px; }
  tr.detail-row col.d-work   { width: auto; }
  tr.detail-row col.d-role   { width: 22%; }
  tr.detail-row col.d-years  { width: 50px; }
  tr.detail-row thead th { background: #f4f4f4; padding: 8px 12px; font-size: 11px; }
  tr.detail-row td.inner-cell {
    padding: 8px 12px; font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  tr.detail-row td.inner-cell .pill { font-size: 11px; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    background: #f2dede; color: #a83030;
  }
  .pill.mid { background: #e8c8c8; color: #7a1a1a; }
  .pill.dark { background: var(--hfk-red-soft); color: var(--hfk-red); }
  .pill.gray { background: #eee; color: var(--ink-2); }

  .loading, .error { padding: 40px; text-align: center; color: var(--ink-3); }
  .error { color: var(--hfk-red); }

  footer {
    margin-top: 48px; padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--ink-3); font-size: 12px;
  }

  /* --- Password gate --- */
  .gate {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 100;
  }
  .gate-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 32px 28px;
    width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }
  .gate-card .logo {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px;
  }
  .gate-card .logo .accent { color: var(--hfk-red); }
  .gate-card .sub { color: var(--ink-3); font-size: 13px; margin-bottom: 24px; }
  .gate-card form { display: flex; flex-direction: column; gap: 10px; }
  .gate-card input[type="password"] {
    font: inherit; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink);
    text-align: center; letter-spacing: 0.1em;
  }
  .gate-card input[type="password"]:focus {
    outline: 2px solid var(--hfk-red); outline-offset: 1px;
    border-color: var(--hfk-red);
  }
  .gate-card button {
    font: inherit; padding: 12px; border: 0; border-radius: 10px;
    background: var(--hfk-red); color: #fff; font-weight: 600; cursor: pointer;
  }
  .gate-card button:hover { background: #7a0000; }
  .gate-card button:disabled { background: #ccc; cursor: not-allowed; }
  .gate-card .error {
    color: var(--hfk-red); font-size: 12px; min-height: 16px; padding: 0;
  }

  #main-app[hidden] { display: none; }

  /* Mobile refinements */
  @media (max-width: 600px) {
    .wrap { padding: 20px 14px 48px; }
    h1 { font-size: 22px; }
    .kpi { padding: 14px 14px; }
    .kpi .value { font-size: 22px; }
    .kpi .label { font-size: 10px; }
    .card { padding: 14px; }
    .chart-box { height: 240px; }
    .chart-box.tall { height: 340px; }
    th, td { padding: 10px 12px; }
    section { margin-top: 28px; }
    select { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="logo"><span class="accent">HFK</span> 멤버 대쉬보드</div>
    <div class="sub">비밀번호를 입력하세요</div>
    <form id="gate-form" autocomplete="off">
      <input id="gate-pw" type="password" inputmode="text" autocomplete="current-password"
             autofocus required aria-label="비밀번호">
      <button id="gate-btn" type="submit">입장</button>
      <div id="gate-error" class="error"></div>
    </form>
  </div>
</div>

<div id="main-app" hidden>
  <div class="wrap">
    <header>
      <div>
        <h1><span class="accent">HFK</span> 멤버 대쉬보드</h1>
        <div class="meta">시즌·팀·유입 집계</div>
      </div>
      <div class="meta">
        <span class="status" id="status">데이터 불러오는 중...</span>
        <button class="lock-btn" id="lock-btn" title="세션 잠금">잠그기</button>
      </div>
    </header>
    <div id="app" class="loading">데이터를 준비하고 있어요.</div>
  </div>
</div>

<script>
/* ---------- Encrypted config (substituted by build.mjs) ---------- */
const ENC_SALT = "__SALT__";
const ENC_IV   = "__IV__";
const ENC_CT   = "__CIPHERTEXT__";
const SESSION_KEY = "hfk_dash_csv_url_v1";

const b64ToBytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function tryUnlock(password) {
  try {
    const enc = new TextEncoder();
    const salt = b64ToBytes(ENC_SALT);
    const iv   = b64ToBytes(ENC_IV);
    const ct   = b64ToBytes(ENC_CT);
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 300000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false, ["decrypt"]
    );
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    const [sheet_id, gid] = new TextDecoder().decode(pt).split("|");
    if (!sheet_id || !gid) return null;
    return `https://docs.google.com/spreadsheets/d/${sheet_id}/export?format=csv&gid=${gid}`;
  } catch (e) {
    return null;
  }
}

let CSV_URL = null;

async function boot() {
  const cached = sessionStorage.getItem(SESSION_KEY);
  if (cached) {
    CSV_URL = cached;
    showMain();
    return;
  }
  document.getElementById("gate").style.display = "flex";
  document.getElementById("gate-pw").focus();
}

document.getElementById("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pwEl = document.getElementById("gate-pw");
  const btn = document.getElementById("gate-btn");
  const err = document.getElementById("gate-error");
  err.textContent = "";
  btn.disabled = true; btn.textContent = "확인 중...";
  const url = await tryUnlock(pwEl.value);
  btn.disabled = false; btn.textContent = "입장";
  if (!url) {
    err.textContent = "비밀번호가 맞지 않습니다.";
    pwEl.select();
    return;
  }
  CSV_URL = url;
  sessionStorage.setItem(SESSION_KEY, url);
  pwEl.value = "";
  showMain();
});

function showMain() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("main-app").hidden = false;
  main();
}

document.getElementById("lock-btn").addEventListener("click", () => {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
});

/* ---------- App constants ---------- */
const HFK_RED = "#980000";
const HFK_MID_RED = "#b8656b";
const HFK_RED_SOFT = "#e0b0b0";
const NEUTRAL = "#4a4a4a";
const NEUTRAL_SOFT = "#a8a8a8";
const PALETTE = [
  "#980000", "#c96a6a", "#4a4a4a", "#a8a8a8",
  "#7a4a4a", "#5a3a3a", "#d9a5a5", "#8a8a8a",
  "#b57c7c", "#3a3a3a", "#e8c8c8", "#6a6a6a"
];

/* ---------- CSV parsing (RFC 4180-ish) ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQ = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(field); field = ""; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

/* ---------- helpers ---------- */
function seasonSortKey(s) {
  const m = s.match(/^(\d{4})년\s*(\d{2})/);
  if (m) return parseInt(m[1] + m[2], 10);
  return 999999;
}
function fmt(n) { return n.toLocaleString("ko-KR"); }
function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }

/* ---------- main ---------- */
async function main() {
  const statusEl = document.getElementById("status");
  const appEl = document.getElementById("app");
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const headers = rows[0];
    const records = rows.slice(1).filter(r => r.length >= headers.length && r.some(v => v && v.trim()));

    const COL = {
      timestamp: 0, season: 3, name: 6, team: 7, workplace: 8, role: 9,
      phone: 10, years: 12, channel: 13,
      workRegion: 24, liveRegion: 25,
    };

    render(records, COL, appEl);
    statusEl.textContent = `최근 갱신 · ${new Date().toLocaleString("ko-KR")}`;
  } catch (e) {
    console.error(e);
    statusEl.textContent = "불러오기 실패";
    statusEl.classList.add("err");
    appEl.className = "error";
    appEl.textContent = "시트를 불러오지 못했습니다: " + e.message;
  }
}

function render(records, COL, appEl) {
  const rows = records.filter(r => (r[COL.season] || "").trim());

  const total = rows.length;
  const memberKey = r => (r[COL.name] || "").trim() + "|" + ((r[COL.phone] || "").replace(/\D/g, "").slice(-4));
  const uniqueMembers = new Set(rows.map(memberKey).filter(k => k !== "|")).size;
  const seasons = [...new Set(rows.map(r => r[COL.season].trim()))]
    .sort((a, b) => seasonSortKey(a) - seasonSortKey(b));

  /* ---------- Compute per-record classification from member timeline ----------
     첫등록  = member's 1st appearance
     첫재등록 = 2nd appearance AND it's the season immediately after the 1st
                (연속 시즌 등록만 첫재등록으로 인정)
     재등록  = every other repeat appearance
                (2nd appearance with a season gap, 또는 3rd+ appearance)                */
  const seasonIndex = new Map();
  seasons.forEach((s, i) => seasonIndex.set(s, i));

  const historyByMember = new Map();
  rows.forEach(r => {
    const k = memberKey(r);
    if (k === "|") return;
    if (!historyByMember.has(k)) historyByMember.set(k, []);
    historyByMember.get(k).push(r);
  });
  const kindByRow = new WeakMap();
  historyByMember.forEach(hist => {
    // Group by season so same-season duplicates share the same appearance index
    const bySeason = new Map();
    hist.forEach(r => {
      const s = r[COL.season].trim();
      if (!bySeason.has(s)) bySeason.set(s, []);
      bySeason.get(s).push(r);
    });
    const sortedS = [...bySeason.keys()].sort((a, b) => seasonSortKey(a) - seasonSortKey(b));
    sortedS.forEach((s, i) => {
      let kind;
      if (i === 0) {
        kind = "첫등록";
      } else if (i === 1 && seasonIndex.get(s) === seasonIndex.get(sortedS[0]) + 1) {
        kind = "첫재등록";
      } else {
        kind = "재등록";
      }
      bySeason.get(s).forEach(r => kindByRow.set(r, kind));
    });
  });
  const kindOf = r => kindByRow.get(r) || "기타";

  const seasonAgg = {};
  seasons.forEach(s => seasonAgg[s] = { first: 0, firstReturn: 0, repeat: 0, other: 0 });
  rows.forEach(r => {
    const s = r[COL.season].trim();
    const k = kindOf(r);
    if (k === "첫등록") seasonAgg[s].first++;
    else if (k === "첫재등록") seasonAgg[s].firstReturn++;
    else if (k === "재등록") seasonAgg[s].repeat++;
    else seasonAgg[s].other++;
  });

  // 첫재등록률 per season = (이번 첫재등록) / (직전 시즌 첫등록)
  seasons.forEach((s, i) => {
    if (i === 0) { seasonAgg[s].firstReturnRate = null; return; }
    const prevFirst = seasonAgg[seasons[i - 1]].first;
    seasonAgg[s].firstReturnRate = prevFirst
      ? Math.round((seasonAgg[s].firstReturn / prevFirst) * 100)
      : null;
  });

  const latestSeason = seasons[seasons.length - 1];
  const latestRows = rows.filter(r => r[COL.season].trim() === latestSeason);
  const latestFirst       = latestRows.filter(r => kindOf(r) === "첫등록").length;
  const latestFirstReturn = latestRows.filter(r => kindOf(r) === "첫재등록").length;
  const latestRepeat      = latestRows.filter(r => kindOf(r) === "재등록").length;
  const latestReturnTotal = latestFirstReturn + latestRepeat;
  const repeatRate = pct(latestReturnTotal, latestFirst + latestReturnTotal);
  const latestFirstReturnRate = seasonAgg[latestSeason].firstReturnRate;
  const prevSeasonName = seasons.length >= 2 ? seasons[seasons.length - 2] : null;
  const prevSeasonFirst = prevSeasonName ? seasonAgg[prevSeasonName].first : 0;

  const countBy = (idx, opts = {}) => {
    const c = {};
    rows.forEach(r => {
      let v = (r[idx] || "").trim();
      if (!v || v === "#REF!") return;
      if (opts.normalize) v = opts.normalize(v);
      if (!v) return;
      c[v] = (c[v] || 0) + 1;
    });
    return Object.entries(c).sort((a, b) => b[1] - a[1]);
  };
  const topN = (arr, n) => arr.slice(0, n);

  const roleCounts    = topN(countBy(COL.role), 15);
  const channelCounts = topN(countBy(COL.channel), 8);
  const workRegionCounts = topN(countBy(COL.workRegion), 10);
  const liveRegionCounts = topN(countBy(COL.liveRegion), 10);
  const yearsCounts = countBy(COL.years, {
    normalize: v => {
      const n = parseInt(v, 10);
      if (isNaN(n)) return "";
      if (n <= 3) return "0-3년차";
      if (n <= 6) return "4-6년차";
      if (n <= 10) return "7-10년차";
      if (n <= 15) return "11-15년차";
      if (n <= 20) return "16-20년차";
      return "20년+";
    }
  }).sort((a, b) => {
    const order = ["0-3년차","4-6년차","7-10년차","11-15년차","16-20년차","20년+"];
    return order.indexOf(a[0]) - order.indexOf(b[0]);
  });

  appEl.className = "";
  appEl.innerHTML = `
    <section>
      <div class="kpi-grid">
        <div class="kpi"><div class="label">누적 등록</div><div class="value">${fmt(total)}</div><div class="foot">전 시즌 합계</div></div>
        <div class="kpi"><div class="label">유니크 멤버</div><div class="value">${fmt(uniqueMembers)}</div><div class="foot">이름+휴대폰 기준</div></div>
        <div class="kpi"><div class="label">시즌 수</div><div class="value">${fmt(seasons.length)}</div><div class="foot">첫 시즌 → 최신</div></div>
        <div class="kpi"><div class="label">최신 시즌 등록</div><div class="value red">${fmt(latestRows.length)}</div><div class="foot">${latestSeason}</div></div>
        <div class="kpi"><div class="label">신규</div><div class="value">${fmt(latestFirst)}</div><div class="foot">최신 시즌 첫등록</div></div>
        <div class="kpi"><div class="label">첫재등록</div><div class="value">${fmt(latestFirstReturn)}</div><div class="foot">직전 시즌 첫등록 → 연속 등록</div></div>
        <div class="kpi"><div class="label">재등록</div><div class="value">${fmt(latestRepeat)}</div><div class="foot">첫재등록 외 모든 재등록</div></div>
        <div class="kpi"><div class="label">재등록률</div><div class="value red">${repeatRate}%</div><div class="foot">(첫재등록+재등록) / 전체</div></div>
        <div class="kpi"><div class="label">첫재등록률</div><div class="value red">${latestFirstReturnRate == null ? '–' : latestFirstReturnRate + '%'}</div><div class="foot">${prevSeasonFirst ? `직전 시즌 첫등록 ${fmt(prevSeasonFirst)}명 중` : '직전 시즌 데이터 없음'}</div></div>
      </div>
    </section>

    <section>
      <h2>분포·추이 <span class="sub">전 시즌 누적 기준</span></h2>
      <div class="charts">
        <div class="card col-12">
          <h3>시즌별 등록 추이 <span class="sub">신규·재등록 스택</span></h3>
          <div class="chart-box tall"><canvas id="chart-seasons"></canvas></div>
        </div>
        <div class="card col-8">
          <h3>재등록률·첫재등록률 추이 <span class="sub">시즌별</span></h3>
          <div class="chart-box"><canvas id="chart-repeat-rate"></canvas></div>
        </div>
        <div class="card col-4">
          <h3>유입 채널 <span class="sub">Top ${channelCounts.length}</span></h3>
          <div class="chart-box"><canvas id="chart-channel"></canvas></div>
        </div>
        <div class="card col-6">
          <h3>기능 (직무) <span class="sub">Top ${roleCounts.length}</span></h3>
          <div class="chart-box tall"><canvas id="chart-role"></canvas></div>
        </div>
        <div class="card col-6">
          <h3>연차 분포</h3>
          <div class="chart-box tall"><canvas id="chart-years"></canvas></div>
        </div>
        <div class="card col-6">
          <h3>근무 지역 <span class="sub">Top ${workRegionCounts.length}</span></h3>
          <div class="chart-box"><canvas id="chart-work-region"></canvas></div>
        </div>
        <div class="card col-6">
          <h3>거주 지역 <span class="sub">Top ${liveRegionCounts.length}</span></h3>
          <div class="chart-box"><canvas id="chart-live-region"></canvas></div>
        </div>
      </div>
    </section>

    <section>
      <h2>팀·세션별 뷰</h2>
      <div class="controls">
        <label for="season-select" style="font-size:13px;color:var(--ink-2)">시즌</label>
        <select id="season-select">
          ${seasons.slice().reverse().map(s => `<option value="${s}">${s}</option>`).join("")}
        </select>
        <div class="season-summary" id="season-summary"></div>
      </div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col class="c-team"><col class="c-num"><col class="c-num">
            <col class="c-num"><col class="c-num"><col class="c-rate"><col class="c-spacer">
          </colgroup>
          <thead>
            <tr>
              <th>팀</th>
              <th class="num">인원</th>
              <th class="num">신규</th>
              <th class="num">첫재등록</th>
              <th class="num">재등록</th>
              <th class="num">재등록 비율</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="team-tbody"></tbody>
        </table>
      </div>
    </section>

    <footer>
      데이터 출처: Google Sheets · 팀 행 클릭으로 멤버 상세
    </footer>
  `;

  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = "#4a4a4a";
  Chart.defaults.borderColor = "#eee";

  const isMobile = window.matchMedia("(max-width: 600px)").matches;

  new Chart(document.getElementById("chart-seasons"), {
    type: "bar",
    data: {
      labels: seasons,
      datasets: [
        { label: "신규",     data: seasons.map(s => seasonAgg[s].first),       backgroundColor: HFK_RED },
        { label: "첫재등록", data: seasons.map(s => seasonAgg[s].firstReturn), backgroundColor: HFK_MID_RED },
        { label: "재등록",   data: seasons.map(s => seasonAgg[s].repeat),      backgroundColor: HFK_RED_SOFT },
        { label: "기타",     data: seasons.map(s => seasonAgg[s].other),       backgroundColor: NEUTRAL_SOFT },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: {
        x: { stacked: true, ticks: { autoSkip: isMobile, maxRotation: 70, minRotation: 45, font: { size: 10 } } },
        y: { stacked: true, beginAtZero: true }
      }
    }
  });

  new Chart(document.getElementById("chart-repeat-rate"), {
    type: "line",
    data: {
      labels: seasons,
      datasets: [
        {
          label: "재등록률",
          data: seasons.map(s => {
            const a = seasonAgg[s];
            const returned = a.firstReturn + a.repeat;
            const denom = a.first + returned;
            return denom ? Math.round((returned / denom) * 100) : null;
          }),
          borderColor: HFK_RED,
          backgroundColor: "rgba(152,0,0,0.08)",
          fill: true, tension: 0.25, pointRadius: 2,
        },
        {
          label: "첫재등록률",
          data: seasons.map(s => seasonAgg[s].firstReturnRate),
          borderColor: HFK_MID_RED,
          backgroundColor: "transparent",
          borderDash: [4, 4],
          fill: false, tension: 0.25, pointRadius: 2,
          spanGaps: true,
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y == null ? '–' : ctx.parsed.y + '%'}` } },
      },
      scales: {
        x: { ticks: { autoSkip: true, maxRotation: 70, minRotation: 45, font: { size: 10 } } },
        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + "%" } }
      }
    }
  });

  new Chart(document.getElementById("chart-channel"), {
    type: "doughnut",
    data: {
      labels: channelCounts.map(c => c[0]),
      datasets: [{ data: channelCounts.map(c => c[1]), backgroundColor: PALETTE }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } }
    }
  });

  new Chart(document.getElementById("chart-role"), {
    type: "bar",
    data: {
      labels: roleCounts.map(c => c[0]),
      datasets: [{ data: roleCounts.map(c => c[1]), backgroundColor: HFK_RED }]
    },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true } }
    }
  });

  new Chart(document.getElementById("chart-years"), {
    type: "bar",
    data: {
      labels: yearsCounts.map(c => c[0]),
      datasets: [{ data: yearsCounts.map(c => c[1]), backgroundColor: HFK_RED_SOFT }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true } }
    }
  });

  new Chart(document.getElementById("chart-work-region"), {
    type: "bar",
    data: {
      labels: workRegionCounts.map(c => c[0]),
      datasets: [{ data: workRegionCounts.map(c => c[1]), backgroundColor: NEUTRAL }]
    },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true } }
    }
  });

  new Chart(document.getElementById("chart-live-region"), {
    type: "bar",
    data: {
      labels: liveRegionCounts.map(c => c[0]),
      datasets: [{ data: liveRegionCounts.map(c => c[1]), backgroundColor: NEUTRAL }]
    },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true } }
    }
  });

  /* ---------- Season/Team view ---------- */
  const selectEl = document.getElementById("season-select");
  const tbodyEl = document.getElementById("team-tbody");
  const summaryEl = document.getElementById("season-summary");

  let currentSeason = latestSeason;
  let openTeam = null;

  const KIND_ORDER = { "첫등록": 0, "첫재등록": 1, "재등록": 2 };
  const kindRank = k => (k in KIND_ORDER) ? KIND_ORDER[k] : 3;

  function renderTeamTable(season) {
    currentSeason = season;
    const scope = rows.filter(r => r[COL.season].trim() === season);
    const byTeam = {};
    scope.forEach(r => {
      const team = (r[COL.team] || "미지정").trim() || "미지정";
      const k = kindOf(r);
      if (!byTeam[team]) byTeam[team] = { total: 0, first: 0, firstReturn: 0, repeat: 0 };
      byTeam[team].total++;
      if (k === "첫등록") byTeam[team].first++;
      else if (k === "첫재등록") byTeam[team].firstReturn++;
      else if (k === "재등록") byTeam[team].repeat++;
    });
    const teams = Object.entries(byTeam).sort((a, b) => b[1].total - a[1].total);

    summaryEl.innerHTML = `총 <b>${fmt(scope.length)}</b>명 · <b>${teams.length}</b>개 팀 · <span style="color:var(--ink-3)">팀 행을 클릭하면 멤버 보기</span>`;

    tbodyEl.innerHTML = teams.map(([team, s]) => {
      const returned = s.firstReturn + s.repeat;
      const denom = s.first + returned;
      const rate = denom ? Math.round((returned / denom) * 100) : 0;
      return `<tr class="clickable" data-team="${escapeHtml(team)}">
        <td>${escapeHtml(team)}</td>
        <td class="num">${fmt(s.total)}</td>
        <td class="num">${fmt(s.first)}</td>
        <td class="num">${fmt(s.firstReturn)}</td>
        <td class="num">${fmt(s.repeat)}</td>
        <td class="num">${denom ? `<span class="pill">${rate}%</span>` : `<span class="pill gray">–</span>`}</td>
        <td></td>
      </tr>`;
    }).join("");

    if (openTeam && byTeam[openTeam]) openTeamDetail(openTeam);
    else openTeam = null;
  }

  function buildDetailRow(team) {
    const members = rows
      .filter(r =>
        r[COL.season].trim() === currentSeason &&
        ((r[COL.team] || "미지정").trim() || "미지정") === team
      )
      .sort((a, b) => {
        const rankDiff = kindRank(kindOf(a)) - kindRank(kindOf(b));
        if (rankDiff !== 0) return rankDiff;
        return (a[COL.name] || "").localeCompare(b[COL.name] || "", "ko");
      });

    const pillFor = (kind) => {
      if (kind === "첫등록") return "pill gray";
      if (kind === "첫재등록") return "pill mid";
      if (kind === "재등록") return "pill dark";
      return "pill gray";
    };

    // 시즌 이름 압축: "2026년 09-11월 가을시즌" → "2026 가을"
    const compactSeason = s => {
      const m = s.match(/(\d{4})년.*?(봄|여름|가을|겨울|얼리)/);
      return m ? `${m[1]} ${m[2]}` : s;
    };

    // 이 row가 해당 멤버의 몇 번째 등록인지 + 첫 시즌 계산 (히스토리 1회 조회로 공유)
    const memberMeta = r => {
      const k = memberKey(r);
      if (k === "|") return { appear: 1, first: r[COL.season].trim() };
      const hist = historyByMember.get(k);
      if (!hist) return { appear: 1, first: r[COL.season].trim() };
      const memSeasons = [...new Set(hist.map(rr => rr[COL.season].trim()))]
        .sort((a, b) => seasonSortKey(a) - seasonSortKey(b));
      const idx = memSeasons.indexOf(r[COL.season].trim());
      return { appear: idx + 1, first: memSeasons[0] };
    };

    const rowsHtml = members.map((r, i) => {
      const kind = kindOf(r);
      const meta = memberMeta(r);
      let kindLabel;
      if (kind === "기타") kindLabel = "-";
      else if (kind === "재등록") kindLabel = `재등록 ${meta.appear}`;
      else kindLabel = kind;
      return `<tr>
        <td class="inner-cell num">${i + 1}</td>
        <td class="inner-cell">${escapeHtml((r[COL.name] || "").trim() || "-")}</td>
        <td class="inner-cell"><span class="${pillFor(kind)}">${escapeHtml(kindLabel)}</span></td>
        <td class="inner-cell" style="white-space:nowrap;color:var(--ink-2)">${escapeHtml(compactSeason(meta.first))}</td>
        <td class="inner-cell">${escapeHtml((r[COL.workplace] || "").trim() || "-")}</td>
        <td class="inner-cell">${escapeHtml((r[COL.role] || "").trim() || "-")}</td>
        <td class="inner-cell num">${escapeHtml((r[COL.years] || "").trim() || "-")}</td>
      </tr>`;
    }).join("");

    return `<tr class="detail-row" data-detail-for="${escapeHtml(team)}">
      <td colspan="7">
        <div class="detail-inner">
          <table>
            <colgroup>
              <col class="d-idx">
              <col class="d-name">
              <col class="d-kind">
              <col class="d-first">
              <col class="d-work">
              <col class="d-role">
              <col class="d-years">
            </colgroup>
            <thead>
              <tr>
                <th class="num">#</th>
                <th>이름</th>
                <th>구분</th>
                <th>첫시즌</th>
                <th>직장명</th>
                <th>기능</th>
                <th class="num">연차</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </td>
    </tr>`;
  }

  function closeAnyDetail() {
    tbodyEl.querySelectorAll("tr.detail-row").forEach(x => x.remove());
    tbodyEl.querySelectorAll("tr.selected").forEach(x => x.classList.remove("selected"));
  }

  function openTeamDetail(team) {
    closeAnyDetail();
    const teamRow = tbodyEl.querySelector(`tr.clickable[data-team="${cssEscape(team)}"]`);
    if (!teamRow) { openTeam = null; return; }
    teamRow.classList.add("selected");
    teamRow.insertAdjacentHTML("afterend", buildDetailRow(team));
    openTeam = team;
  }

  function cssEscape(s) {
    return String(s).replace(/(["\\])/g, "\\$1");
  }

  tbodyEl.addEventListener("click", e => {
    const tr = e.target.closest("tr.clickable");
    if (!tr) return;
    const team = tr.getAttribute("data-team");
    if (team === openTeam) {
      closeAnyDetail();
      openTeam = null;
    } else {
      openTeamDetail(team);
    }
  });

  selectEl.addEventListener("change", e => renderTeamTable(e.target.value));
  renderTeamTable(latestSeason);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])
  );
}

boot();
</script>
</body>
</html>
